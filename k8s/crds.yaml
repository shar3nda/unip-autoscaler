apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingconfigs.autoscaler.unified-platform.cs.hse.ru
spec:
  group: autoscaler.unified-platform.cs.hse.ru
  names:
    kind: ScalingConfig
    plural: scalingconfigs
    shortNames:
    - scalecfg
    singular: scalingconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              prometheusMetrics:
                items:
                  properties:
                    name:
                      title: Name
                      type: string
                    query:
                      title: Query
                      type: string
                  required:
                  - name
                  - query
                  title: PrometheusMetric
                  type: object
                title: Prometheusmetrics
                type: array
              scalingOptions:
                properties:
                  cooldown:
                    title: Cooldown
                    type: integer
                  cpuTimeWindow:
                    default: 300
                    title: Cputimewindow
                    type: integer
                  hibernationEnabled:
                    title: Hibernationenabled
                    type: boolean
                  memoryTimeWindow:
                    default: 300
                    title: Memorytimewindow
                    type: integer
                required:
                - cooldown
                - hibernationEnabled
                title: ScalingOptions
                type: object
              states:
                items:
                  properties:
                    replicas:
                      title: Replicas
                      type: integer
                    transitions:
                      items:
                        properties:
                          conditions:
                            properties:
                              allConditions:
                                items:
                                  properties:
                                    metric:
                                      title: Metric
                                      type: string
                                    operator:
                                      enum:
                                      - lt
                                      - gt
                                      title: Operator
                                      type: string
                                    value:
                                      title: Value
                                      type: number
                                  required:
                                  - metric
                                  - operator
                                  - value
                                  title: Condition
                                  type: object
                                title: Allconditions
                                type: array
                              anyCondition:
                                items:
                                  properties:
                                    metric:
                                      title: Metric
                                      type: string
                                    operator:
                                      enum:
                                      - lt
                                      - gt
                                      title: Operator
                                      type: string
                                    value:
                                      title: Value
                                      type: number
                                  required:
                                  - metric
                                  - operator
                                  - value
                                  title: Condition
                                  type: object
                                title: Anycondition
                                type: array
                            title: ConditionSet
                            type: object
                          nextState:
                            title: Nextstate
                            type: integer
                        required:
                        - nextState
                        - conditions
                        title: Transition
                        type: object
                      title: Transitions
                      type: array
                  required:
                  - replicas
                  title: State
                  type: object
                title: States
                type: array
              target:
                properties:
                  kind:
                    enum:
                    - deployment
                    - service
                    title: TargetKind
                    type: string
                  name:
                    title: Name
                    type: string
                  namespace:
                    title: Namespace
                    type: string
                required:
                - kind
                - name
                - namespace
                title: Target
                type: object
            required:
            - target
            - states
            - scalingOptions
            title: ScalingConfig
            type: object
        type: object
    served: true
    storage: true
