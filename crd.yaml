apiVersion: autoscaler.unified-platform.cs.hse.ru/v1alpha1
kind: ScalingConfig
metadata:
  name: my-app-autoscaler
  namespace: testing
spec:
  prometheusMetrics:
  - name: mycpu
    query: sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~"{{ DEPLOYMENT_NAME
      }}-.*"}[5m])) * 100
  - name: mymemory
    query: sum(container_memory_usage_bytes{pod=~"{{ DEPLOYMENT_NAME }}-.*"}) / 1024
      / 1024
  - name: queries
    query: sum(rate(nginx_ingress_controller_requests{ingress="service-api-ingress",
      namespace="{{ NAMESPACE }}"}[10m]))
  scalingOptions:
    cooldown: 300
    cpuTimeWindow: 300
    hibernationEnabled: false
    memoryTimeWindow: 300
  states:
  - replicas: 1
    transitions:
    - conditions:
        allConditions:
        - metric: mycpu
          operator: gt
          value: 20
        - metric: queries
          operator: gt
          value: 200
      nextState: 2
  - replicas: 2
    transitions:
    - conditions:
        allConditions:
        - metric: queries
          operator: gt
          value: 500
      nextState: 3
    - conditions:
        anyCondition:
        - metric: mycpu
          operator: lt
          value: 10
        - metric: queries
          operator: lt
          value: 200
      nextState: 1
  - replicas: 3
    transitions:
    - conditions:
        allConditions:
        - metric: mycpu
          operator: gt
          value: 70
        - metric: mymemory
          operator: gt
          value: 500
      nextState: 4
    - conditions:
        anyCondition:
        - metric: mycpu
          operator: lt
          value: 30
        - metric: mymemory
          operator: lt
          value: 200
      nextState: 2
  - replicas: 4
  target:
    kind: deployment
    name: tesseract-app-deployment
    namespace: pu-test-tesseract
