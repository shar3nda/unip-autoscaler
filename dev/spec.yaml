target:
  kind: deployment
  name: tesseract-app-deployment
  namespace: pu-test-tesseract
states:
  - replicas: 1
    transitions:
      - nextState: 2
        conditions:
          allConditions:
            - metric: mycpu
              operator: "gt"
              value: 20.0
            - metric: queries
              operator: "gt"
              value: 201
  - replicas: 2
    transitions:
      - nextState: 3
        conditions:
          allConditions:
            - metric: queries
              operator: "gt"
              value: 500
      - nextState: 1
        conditions:
          anyCondition:
            - metric: mycpu
              operator: "lt"
              value: 10.0
            - metric: queries
              operator: "lt"
              value: 200
  - replicas: 3
    transitions:
      - nextState: 4
        conditions:
          allConditions:
            - metric: mycpu
              operator: "gt"
              value: 70.0
            - metric: mymemory
              operator: "gt"
              value: 500.0
      - nextState: 2
        conditions:
          anyCondition:
            - metric: mycpu
              operator: "lt"
              value: 30.0
            - metric: mymemory
              operator: "lt"
              value: 200.0
  - replicas: 4
    # transitions:
    #   - nextState: 3
    #     conditions:
    #       anyCondition:
    #         - metric: mycpu
    #           operator: "lt"
    #           value: 60.0
    #         - metric: mymemory
    #           operator: "lt"
    #           value: 400.0
prometheusMetrics:
  - name: mycpu
    query: >-
      sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~"{{ DEPLOYMENT_NAME }}-.*"}[5m])) * 100
  - name: mymemory
    query: >-
      sum(container_memory_usage_bytes{pod=~"{{ DEPLOYMENT_NAME }}-.*"}) / 1024 / 1024
  - name: queries
    query: >-
      sum(rate(nginx_ingress_controller_requests{ingress="service-api-ingress", namespace="{{ NAMESPACE }}"}[10m]))
scalingOptions:
  # cpuTimeWindow: 300
  # memoryTimeWindow: 300
  cooldown: 300
  hibernationEnabled: false